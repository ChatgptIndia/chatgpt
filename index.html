<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">✦ Nova AI</div>
      <button id="newChat">＋ New chat</button>

      <h4>Recent</h4>

      <div class="bottom">
        <button id="themeBtn">☾ Dark mode</button>
        <button id="clearBtn">⌫ Clear chats</button>
      </div>
    </aside>

    <main class="main">
      <header>
        <button id="menuBtn">☰</button>
        <b>● Nova AI</b>
      </header>

      <section id="chat">

          <div class="logo">✦</div>

          <div class="suggestions">

      </section>

      <div class="composer-area">
        <form id="form">
          <textarea id="input" placeholder="Message Nova AI..." rows="1"></textarea>

      </div>
    </main>
